[package]
name = "supersocket"
description = "A socket server framework for Rust with pipeline filters, sessions, commands and middleware, inspired by SuperSocket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
## TLS through rustls, for listeners and, with `client`, for the client.
tls = ["supersocket-server/tls", "supersocket-client?/tls"]
## Loading `ServerOptions` from TOML or JSON files with environment overrides.
config = ["supersocket-server/config"]
## The client, `EasyClient`.
client = ["dep:supersocket-client"]
## HTTP CONNECT, SOCKS4 and SOCKS5 proxy connectors for the client.
proxy = ["client", "supersocket-client/proxy"]

[dependencies]
supersocket-connection.workspace = true
supersocket-proto.workspace = true
supersocket-server.workspace = true
supersocket-client = { workspace = true, optional = true }

[dev-dependencies]
rcgen.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[example]]
name = "tls_echo_server"
required-features = ["tls"]

[[example]]
name = "config_server"
required-features = ["config"]

[[example]]
name = "echo_client"
required-features = ["client"]

[[example]]
name = "proxy_client"
required-features = ["proxy"]

[[test]]
name = "tls"
required-features = ["tls"]

[[test]]
name = "client"
required-features = ["client"]

[[test]]
name = "client_tls"
required-features = ["tls", "client"]

[[test]]
name = "proxy"
required-features = ["proxy"]

[lints]
workspace = true
