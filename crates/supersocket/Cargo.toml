[package]
name = "supersocket"
description = "A socket server framework for Rust with pipeline filters, sessions, commands and middleware, inspired by SuperSocket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true

[features]
## TLS through rustls, for listeners and, with `client`, for the clients.
tls = ["supersocket-server/tls", "supersocket-client?/tls", "supersocket-websocket?/tls"]
## Loading `ServerOptions` from TOML or JSON files with environment overrides.
config = ["supersocket-server/config"]
## The client, `EasyClient`, and with `websocket` the WebSocket client.
client = ["dep:supersocket-client", "supersocket-websocket?/client"]
## HTTP CONNECT, SOCKS4 and SOCKS5 proxy connectors for the client.
proxy = ["client", "supersocket-client/proxy"]
## The WebSocket server, and with `client` the WebSocket client.
websocket = ["dep:supersocket-websocket"]
## Gzip compression of connections: `GzipLayer`, and with `client` `GzipConnector`.
gzip = ["supersocket-server/gzip", "supersocket-client?/gzip"]
## `CodecFilter`, which runs a `tokio_util::codec::Decoder` as a pipeline filter.
codec = ["supersocket-proto/codec"]
## WebSocket per-message compression (`permessage-deflate`), with `websocket`.
deflate = ["websocket", "supersocket-websocket/deflate"]
## Commands whose package body is JSON: `JsonCommand`, and with `websocket` `JsonWebSocketCommand`.
json = ["supersocket-server/json", "supersocket-websocket?/json"]
## The UDP listener, `udp::UdpListener`, which serves datagrams as sessions.
udp = ["dep:supersocket-udp"]
## HTTP/1.1 in the `http` module: a request filter, responses, keep-alive and Server-Sent Events.
http = ["dep:supersocket-http"]

[dependencies]
supersocket-connection.workspace = true
supersocket-proto.workspace = true
supersocket-server.workspace = true
supersocket-client = { workspace = true, optional = true }
supersocket-websocket = { workspace = true, optional = true }
supersocket-udp = { workspace = true, optional = true }
supersocket-http = { workspace = true, optional = true }

[dev-dependencies]
futures-util.workspace = true
rcgen.workspace = true
serde.workspace = true
socket2 = { workspace = true, features = ["all"] }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

