[package]
name = "supersocket-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
supersocket-connection = { path = "../crates/supersocket-connection" }
supersocket-proto = { path = "../crates/supersocket-proto", features = ["codec"] }
supersocket-server = { path = "../crates/supersocket-server" }
supersocket-websocket = { path = "../crates/supersocket-websocket" }
bytes = "1"
tokio = { version = "1", default-features = false, features = ["rt"] }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }

[[bin]]
name = "proto_filters"
path = "fuzz_targets/proto_filters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "websocket_server"
path = "fuzz_targets/websocket_server.rs"
test = false
doc = false
bench = false

[[bin]]
name = "websocket_client"
path = "fuzz_targets/websocket_client.rs"
test = false
doc = false
bench = false

[[bin]]
name = "websocket_handshake"
path = "fuzz_targets/websocket_handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_protocol"
path = "fuzz_targets/proxy_protocol.rs"
test = false
doc = false
bench = false

[workspace]
